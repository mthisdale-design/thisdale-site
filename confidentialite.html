<h1 style="margin: 0; font-size: clamp(40px, 6vw, 64px); line-height: 1.04; font-weight: 600; letter-spacing: -0.04em">Politique de confidentialité</h1>
<p style="margin: 0; font-size: 19px; color: #6e6e73">Votre vie privée est importante. Voici, en langage simple, comment vos renseignements personnels sont recueillis, utilisés, protégés et quels sont vos droits.</p>
<p style="margin: 0; font-size: 14px; color: #6e6e73">Dernière mise à jour : 23 novembre 2026</p>
</div>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">1. Qui est responsable de vos renseignements</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Thisdale désigne les activités de Michael Thisdale, conseiller en sécurité financière (certificat AMF n° 161128), rattaché à Dubois Services Financiers inc., et de son équipe.</p>
<p style="margin: 0; font-size: 17px; color: #424245">Responsable de la protection des renseignements personnels : Michael Thisdale<br>44, avenue des Chênes, Candiac (Québec) J5R 0V2<br>Courriel : <a href="mailto:michael@thisdale.ca">michael@thisdale.ca</a> · Téléphone : <a href="tel:+14382314777">438 231-4777</a></p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">2. Renseignements recueillis</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px">
<li><strong>Coordonnées :</strong> nom, téléphone, courriel.</li>
<li><strong>Renseignements liés à votre demande :</strong> produit qui vous intéresse, situation familiale, âge de chaque personne à assurer, usage du tabac s'il y a lieu et, lors de l'analyse de vos besoins, les renseignements de santé requis par l'assureur.</li>
<li><strong>Données techniques :</strong> adresse IP, type d'appareil et pages consultées, recueillies par des témoins seulement si vous y consentez (sauf les témoins essentiels).</li>
</ul>
<p style="margin: 0; font-size: 17px; color: #424245">Nous recueillons uniquement les renseignements nécessaires aux fins indiquées ci-dessous.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">3. Pourquoi nous les utilisons</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px">
<li>Communiquer avec vous et traiter votre demande, y compris les questions posées à notre assistant de clavardage.</li>
<li>Analyser vos besoins, préparer des soumissions et vous recommander des produits appropriés.</li>
<li>Transmettre votre proposition à l'assureur choisi, avec votre accord.</li>
<li>Tenir votre dossier client et respecter nos obligations légales et réglementaires, notamment envers l'Autorité des marchés financiers.</li>
<li>Vous envoyer des communications par courriel ou texto, seulement si vous y avez consenti.</li>
</ul>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">4. Comment nous les recueillons</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Par le formulaire de ce site, par notre assistant de clavardage, par téléphone, par courriel, par texto, lors de nos rencontres et, avec votre consentement, au moyen de témoins (cookies).</p>
<p style="margin: 0; font-size: 17px; color: #424245"><strong>Assistant de clavardage :</strong> l'assistant du site donne de l'information générale seulement, pas un conseil. Ne lui transmettez pas de renseignements de santé. Les échanges peuvent être conservés pour assurer le suivi de votre demande.</p>
<p style="margin: 0; font-size: 17px; color: #424245"><strong>Textos et courriels :</strong> nous vous écrivons par courriel ou par texto au sujet de votre demande. Les communications d'information ou de rappel sont envoyées seulement si vous y avez consenti. Vous pouvez vous désabonner en tout temps, notamment en répondant ARRÊT à un texto.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">5. Avec qui ils peuvent être partagés</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px">
<li>Dubois Services Financiers inc., le cabinet auquel je suis rattaché, lorsque la réglementation l'exige.</li>
<li>Notre partenaire Guillaume Tremblay (Assurances François Tremblay inc.), lorsque nous vous référons à lui pour l'assurance vie, l'assurance invalidité, l'assurance maladie grave ou l'investissement, afin qu'il puisse communiquer avec vous.</li>
<li>Les assureurs auxquels vous me demandez de soumettre une proposition.</li>
<li>Nos fournisseurs technologiques, notamment notre plateforme de gestion de la relation client (GoHighLevel), qui héberge le site, le formulaire, l'assistant de clavardage, les courriels et les textos. Ils sont liés par des ententes et n'utilisent vos renseignements que pour nous rendre service.</li>
<li>Les autorités, lorsque la loi l'exige.</li>
</ul>
<p style="margin: 0; font-size: 17px; font-weight: 600; color: #1d1d1f">Vos renseignements ne sont jamais vendus.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">6. Hébergement à l'extérieur du Québec</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Notre plateforme de gestion de la relation client (GoHighLevel) et certains autres fournisseurs peuvent conserver vos renseignements à l'extérieur du Québec, notamment aux États-Unis. Avant de communiquer des renseignements hors du Québec, nous évaluons que leur protection est adéquate, comme l'exige la loi. Ces renseignements peuvent alors être soumis aux lois de l'endroit où ils sont conservés.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">7. Conservation et sécurité</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Vos renseignements sont conservés le temps nécessaire aux fins indiquées et pendant les durées minimales exigées par la réglementation applicable aux dossiers clients, puis détruits ou anonymisés de façon sécuritaire. L'accès est limité aux personnes qui en ont besoin, et des mesures de sécurité raisonnables sont en place (accès protégé par mot de passe, authentification, chiffrement lorsque disponible).</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">8. Témoins (cookies)</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px">
<li><strong>Essentiels :</strong> nécessaires au fonctionnement du site. Toujours actifs.</li>
<li><strong>Mesure d'audience :</strong> pour comprendre comment le site est utilisé. Désactivés par défaut.</li>
<li><strong>Marketing :</strong> pour mesurer nos publicités. Désactivés par défaut.</li>
</ul>
<p style="margin: 0; font-size: 17px; color: #424245">Vous pouvez modifier vos choix en tout temps avec le lien « Gestion des témoins » au bas de chaque page.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">9. Vos droits</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px">
<li>Accéder à vos renseignements et en obtenir une copie.</li>
<li>Faire corriger des renseignements inexacts ou incomplets.</li>
<li>Retirer votre consentement en tout temps, y compris aux communications marketing.</li>
<li>Demander que vos renseignements cessent d'être diffusés ou soient désindexés, lorsque la loi le permet.</li>
<li>Obtenir vos renseignements dans un format technologique structuré et couramment utilisé.</li>
</ul>
<p style="margin: 0; font-size: 17px; color: #424245">Pour exercer vos droits, écrivez au responsable indiqué à la section 1. Nous répondons dans un délai de 30 jours.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">10. Plaintes</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Pour toute plainte relative à vos renseignements personnels, communiquez d'abord avec le responsable indiqué à la section 1. Si vous êtes insatisfait de la réponse, vous pouvez vous adresser à la <a href="https://www.cai.gouv.qc.ca">Commission d'accès à l'information du Québec</a>.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">11. Modifications</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Cette politique peut être mise à jour. La date de la dernière mise à jour est indiquée en haut de la page. En cas de changement important, nous vous en informerons.</p>
</section>
