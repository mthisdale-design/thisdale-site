<h1 style="margin: 0; font-size: clamp(40px, 6vw, 64px); line-height: 1.04; font-weight: 600; letter-spacing: -0.04em">Privacy Policy</h1>
<p style="margin: 0; font-size: 19px; color: #6e6e73">Your privacy matters. Here, in plain language, is how your personal information is collected, used and protected, and what your rights are.</p>
<p style="margin: 0; font-size: 14px; color: #6e6e73">Last updated: November 23, 2026</p>
</div>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">1. Who is responsible for your information</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Thisdale refers to the activities of Michael Thisdale, Financial Security Advisor (AMF certificate No. 161128), attached to Dubois Services Financiers inc., and his team.</p>
<p style="margin: 0; font-size: 17px; color: #424245">Person in charge of the protection of personal information: Michael Thisdale<br>44 des Chênes Avenue, Candiac, Québec J5R 0V2<br>Email: <a href="mailto:michael@thisdale.ca">michael@thisdale.ca</a> · Phone: <a href="tel:+14382314777">438 231-4777</a></p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">2. Information we collect</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px"><li><strong>Contact details:</strong> name, phone number, email.</li><li><strong>Information related to your request:</strong> the product you are interested in, your family situation, the age of each person to be insured, smoking status when relevant and, during the needs analysis, health information required by the insurer.</li><li><strong>Technical data:</strong> IP address, device type and pages visited, collected through cookies only with your consent (except essential cookies).</li></ul>
<p style="margin: 0; font-size: 17px; color: #424245">We only collect the information needed for the purposes below.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">3. Why we use it</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px"><li>To contact you and handle your request, including questions asked to our chat assistant.</li><li>To analyze your needs, prepare quotes and recommend suitable products.</li><li>To send your application to the insurer you choose, with your consent.</li><li>To keep your client file and meet our legal and regulatory obligations, including those toward the Autorité des marchés financiers.</li><li>To send you emails or text messages, only if you have consented.</li></ul>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">4. How we collect it</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Through this site's form, our chat assistant, by phone, email, text message, during our meetings and, with your consent, through cookies.</p>
<p style="margin: 0; font-size: 17px; color: #424245"><strong>Chat assistant:</strong> the site's assistant provides general information only, not advice. Please do not share health information with it. Conversations may be kept so we can follow up on your request.</p>
<p style="margin: 0; font-size: 17px; color: #424245"><strong>Texts and emails:</strong> we contact you by email or text message about your request. Information or reminder messages are sent only with your consent. You can unsubscribe at any time, including by replying STOP to a text message.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">5. Who we may share it with</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px"><li>Dubois Services Financiers inc., the firm I am attached to, when regulations require it.</li>
<li>Our partner Guillaume Tremblay (Assurances François Tremblay inc.), when we refer you to him for life, disability or critical illness insurance or investments, so he can contact you.</li><li>The insurers you ask us to submit an application to.</li><li>Our technology providers, including our customer relationship management platform (GoHighLevel), which hosts the site, the form, the chat assistant, emails and text messages. They are bound by agreements and use your information only to provide services to us.</li><li>Authorities, when required by law.</li></ul>
<p style="margin: 0; font-size: 17px; font-weight: 600; color: #1d1d1f">Your information is never sold.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">6. Storage outside Québec</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Our customer relationship management platform (GoHighLevel) and some other providers may store your information outside Québec, including in the United States. Before communicating information outside Québec, we assess that it will be adequately protected, as required by law. This information may then be subject to the laws of the place where it is stored.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">7. Retention and security</h2>
<p style="margin: 0; font-size: 17px; color: #424245">Your information is kept as long as needed for the purposes above and for the minimum periods required by the regulations applicable to client files, then securely destroyed or anonymized. Access is limited to those who need it, and reasonable security measures are in place (password-protected access, authentication, encryption where available).</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">8. Cookies</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px"><li><strong>Essential:</strong> required for the site to work. Always on.</li><li><strong>Analytics:</strong> to understand how the site is used. Off by default.</li><li><strong>Marketing:</strong> to measure our advertising. Off by default.</li></ul>
<p style="margin: 0; font-size: 17px; color: #424245">You can change your choices at any time using the “Cookie settings” link at the bottom of each page.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">9. Your rights</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 17px; color: #424245; display: flex; flex-direction: column; gap: 8px"><li>Access your information and obtain a copy.</li><li>Have inaccurate or incomplete information corrected.</li><li>Withdraw your consent at any time, including for marketing communications.</li><li>Ask that your information stop being disseminated or be de-indexed, where the law allows.</li><li>Obtain your information in a structured, commonly used technological format.</li></ul>
<p style="margin: 0; font-size: 17px; color: #424245">To exercise your rights, write to the person in charge listed in section 1. We respond within 30 days.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">10. Complaints</h2>
<p style="margin: 0; font-size: 17px; color: #424245">For any complaint about your personal information, first contact the person in charge listed in section 1. If you are not satisfied with the response, you may contact the <a href="https://www.cai.gouv.qc.ca">Commission d'accès à l'information du Québec</a>.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px; border-top: 1px solid #d2d2d7">
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">11. Changes</h2>
<p style="margin: 0; font-size: 17px; color: #424245">This policy may be updated. The date of the last update is shown at the top of the page. We will notify you of any significant change.</p>
</section>
