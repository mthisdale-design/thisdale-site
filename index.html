<style>
body{margin:0;background:#fafafc}
a{color:#2f56c4;text-decoration:none}a:hover{color:#1f3f99}
.navlink{color:#1d1d1f !important;padding:8px 14px;border-radius:980px;transition:background .25s}

.btn{transition:background .25s,transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn-ink:hover{background:#000000 !important;color:#ffffff !important;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.btn-blue:hover{background:#3457c2 !important;color:#ffffff !important;box-shadow:0 14px 30px rgba(62,106,225,.35)}
.btn-ghost:hover{background:rgba(0,0,0,.08) !important}
.tab{transition:background .3s,color .3s,box-shadow .3s}
.card{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.card:hover{transform:translateY(-4px)}
.bento{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bento:hover{transform:scale(1.012)}
.ulink{color:inherit !important;text-decoration:underline;text-underline-offset:3px}
.ulink:hover{opacity:.7}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(45deg)}
.chev{transition:transform .3s}
.field:focus{outline:none;border-color:#3e6ae1 !important;box-shadow:0 0 0 4px rgba(62,106,225,.15)}
input[type=checkbox]{accent-color:#3e6ae1}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,40px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,60px) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-70px) scale(1.2)}}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.55)}70%{box-shadow:0 0 0 10px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.blob1{animation:drift1 18s ease-in-out infinite}
.blob2{animation:drift2 22s ease-in-out infinite}
.blob3{animation:drift3 26s ease-in-out infinite}
.sheen{background-size:300% 100%;animation:sheen 6s linear infinite}
.pulse{animation:pulse 2s infinite}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.glowcard{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s,box-shadow .45s}
.glowcard:hover{transform:translateY(-6px);border-color:rgba(120,160,255,.6) !important;box-shadow:0 0 0 1px rgba(120,160,255,.35),0 30px 80px rgba(80,120,255,.35) !important}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.rise2{animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
.rise3{animation:rise .9s .3s cubic-bezier(.2,.8,.2,1) both}
.marquee-track{animation:marquee 38s linear infinite}
.floaty{animation:float 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rise,.rise2,.rise3,.marquee-track,.floaty,.blob1,.blob2,.blob3,.sheen,.pulse{animation:none}}
@media (max-width:900px){.nav-links{display:none !important}}
@media (max-width:600px){.logo-tag{display:none !important}.chat-label{display:none}.chat-launch{width:58px;padding:0 !important;justify-content:center}}
@media (min-width:640px){.span2{grid-column:span 2}}
</style>
</head>
<body>

<template id="tpl">

<div class="blob2" style="position: absolute; right: -10%; top: -6%; width: 680px; height: 680px; border-radius: 50%; background: radial-gradient(circle, rgba(130,160,255,0.28) 0%, rgba(175,140,255,0) 68%); filter: blur(20px)"></div>
<div class="blob3" style="position: absolute; left: 35%; bottom: -18%; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(120,190,255,0.22) 0%, rgba(90,205,255,0) 68%); filter: blur(24px)"></div>
<div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(30,40,90,0.16) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(70% 60% at 50% 40%, #000 0%, transparent 100%); mask-image: radial-gradient(70% 60% at 50% 40%, #000 0%, transparent 100%)"></div>

<p class="rise3" style="margin: 0; max-width: 560px; font-size: clamp(18px, 1.9vw, 22px); line-height: 1.45; color: #55555c">On compare les principales compagnies et on vous présente les 3 meilleures offres. Même avec des médicaments ou une condition préexistante.</p>

<a href="#sante" class="btn btn-ghost" style="min-width: 200px; min-height: 54px; padding: 0 26px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.7); color: #1d1d1f; font-size: 16px; font-weight: 600; border-radius: 980px; border: 1px solid rgba(0,0,0,0.06)">Voir les solutions</a>
</div>

<!-- Comparateur -->

<sc-if value="{{t.selected}}" hint-placeholder-val="{{ false }}"><button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" class="tab" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 46px; padding: 0 22px; border: none; border-radius: 16px; cursor: pointer; background: #ffffff; color: #1d1d1f; box-shadow: 0 4px 14px rgba(0,0,0,0.08)">{{t.label}}</button></sc-if>
<sc-if value="{{t.unselected}}" hint-placeholder-val="{{ true }}"><button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" class="tab" style="font: inherit; font-size: 15px; font-weight: 500; min-height: 46px; padding: 0 22px; border: none; border-radius: 16px; cursor: pointer; background: transparent; color: #55555c">{{t.label}}</button></sc-if>

<span class="mono" style="font-size: 11px; letter-spacing: 0.14em; color: #6e6e73">ESSENTIELLE</span>
<p style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em">Option économique</p>

</div>
<div class="card sheen" style="border-radius: 24px; padding: 2px; background-image: linear-gradient(120deg, #3e6ae1, #7fb2ff, #0b1f5c, #7fb2ff, #3e6ae1); box-shadow: 0 30px 70px rgba(62,106,225,0.28)"><div style="background: #ffffff; border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px">

</sc-for>
</ul>
</div></div>
<div class="card" style="background: rgba(255,255,255,0.9); border-radius: 22px; padding: 24px; border: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 14px">
<span class="mono" style="font-size: 11px; letter-spacing: 0.14em; color: #6e6e73">COMPLÈTE</span>
<p style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em">Protection maximale</p>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="height: 8px; width: 70%; border-radius: 4px; background: #ececf1"></span><span style="height: 8px; width: 90%; border-radius: 4px; background: #ececf1"></span><span style="height: 8px; width: 55%; border-radius: 4px; background: #ececf1"></span></div>
</div>
</div>
</sc-if>

<span class="mono" style="font-size: 11px; letter-spacing: 0.14em; color: #2f56c4">POUR LES ENTREPRISES</span>
<div><p style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Un régime à la mesure de votre équipe</p><p style="margin: 6px 0 0; font-size: 14px; color: #6e6e73">Assurance médico-dentaire collective</p></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px"><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Santé, médicaments et dentaire pour vos employés</li><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Des régimes pour les petites et moyennes entreprises</li><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Accompagnement à l'adhésion et au renouvellement</li></ul>
</div></div></div>
</sc-if>
<sc-if value="{{isInvestTab}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center"><div class="card" style="width: 100%; max-width: 560px; text-align: left; border-radius: 24px; padding: 2px; background-image: linear-gradient(120deg, #3e6ae1, #7fb2ff, #0b1f5c, #7fb2ff, #3e6ae1); box-shadow: 0 30px 70px rgba(62,106,225,0.28)"><div style="background: #ffffff; border-radius: 22px; padding: 30px 28px; display: flex; flex-direction: column; gap: 16px">

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px"><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Analyse de vos objectifs d'épargne et de retraite</li><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Une stratégie adaptée à votre horizon et à votre tolérance au risque</li><li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.45"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6ae1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12l5 5 9-10"/></svg>Un suivi régulier de vos placements</li></ul>

<!-- SANTÉ -->
<section id="sante" style="position: relative; background: #ffffff; padding: 130px 24px; overflow: hidden">
<div style="position: relative; max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { showCookies: true, product: 'sante', situation: 'meds', step: 1, fProduct: null, fWho: null, fGroup: null, err: false, fTime: null, fEmp: null, members: [], faqCat: 'general', chatOpen: false, draft: '', messages: [{ from: 'bot', text: "Bonjour ! Je suis l'assistant Thisdale. Posez votre question ou choisissez un sujet ci-dessous." }] };
this.listEl = null;
}
componentDidUpdate() {
if (this.listEl) { this.listEl.scrollTop = this.listEl.scrollHeight; }
}
answer(q) {
const t = (q || '').toLowerCase();
const cta = "\n\nPour vos 3 offres, faites une demande : un membre de notre équipe vous contactera.";
const rules = [
{ k: ['assurance collective', 'régime collectif pour', 'mon entreprise', 'mes employés', 'pme', 'entreprise'], a: "Oui, nous offrons l'assurance médico-dentaire collective pour les entreprises. On compare les régimes selon la taille de votre équipe et votre budget." + cta },
{ k: ['humain', 'parler', 'appel', 'téléphone', 'telephone', 'quelqu', 'conseiller', 'joindre'], a: "Avec plaisir ! Appelez-nous au 438 231-4777, ou faites une demande en ligne : un membre de notre équipe vous contactera." },
{ k: ['médicament', 'medicament', 'ramq', 'prescription', 'pilule'], a: "Chaque compagnie a sa propre liste de médicaments, et certaines peuvent accepter des médicaments que vous prenez déjà, selon leurs conditions. On vérifie pour vous, compagnie par compagnie." + cta },
{ k: ['collectif', 'employeur', 'groupe', '90 jours'], a: "Si vous quittez un régime collectif, des options sans preuve de santé peuvent s'offrir à vous pendant une période limitée, souvent environ 90 jours. Mieux vaut nous contacter rapidement." + cta },
{ k: ['préexist', 'preexist', 'condition', 'questionnaire', 'maladie chronique', 'diab'], a: "Il existe des plans sans questionnaire médical. Une condition préexistante ne ferme donc pas la porte. On en discute avec vous pour trouver ce qui est possible." + cta },
{ k: ['prix', 'coût', 'cout', 'combien', 'cher', 'prime', 'tarif'], a: "La prime dépend de votre âge, de votre situation et des protections choisies. Vos 3 offres vous donnent le portrait exact, sans engagement." + cta },
{ k: ['voyage', 'voyager', 'vacances', 'étranger', 'etranger', 'hors du pays', 'hors province'], a: "Oui, plusieurs plans d'assurance santé incluent une protection voyage, selon le plan choisi. On vous indique ce qui est couvert dans chacune de vos offres." + cta },
{ k: ['dentaire', 'dents', 'dentiste'], a: "Oui, nous offrons l'assurance dentaire, seule ou avec la santé selon la compagnie. Des délais d'attente peuvent s'appliquer aux soins majeurs : on vous les explique avant toute signature." + cta },
{ k: ['compagnie', 'assureur'], a: "Nous comparons les produits des principales compagnies d'assurance de personnes offertes au Québec, puis on vous présente les 3 meilleures offres pour vous." + cta },
{ k: ['comment', 'étape', 'etape', 'fonctionne', 'après', 'apres', 'processus'], a: "C'est simple : 1) vous faites une demande, 2) un membre de notre équipe discute avec vous de vos besoins, 3) on vous présente vos 3 meilleures offres. Puis on reste là pour le service." },
{ k: ['assurance vie', 'assurance-vie', 'décès', 'deces'], a: "Oui, nous offrons l'assurance vie, pour protéger vos proches : revenu, hypothèque, études des enfants." + cta },
{ k: ['invalidit', 'arrêt de travail', 'arret de travail', 'revenu'], a: "L'assurance invalidité protège votre revenu si vous ne pouvez plus travailler à cause d'une maladie ou d'un accident." + cta },
{ k: ['maladie grave', 'cancer', 'crise cardiaque'], a: "L'assurance maladie grave verse un montant forfaitaire lors du diagnostic d'une maladie couverte, selon le contrat." + cta },
{ k: ['invest', 'reer', 'celi', 'retraite', 'épargne', 'epargne'], a: "Pour l'épargne et la retraite, votre demande est confiée à notre partenaire en investissement, qui vous proposera un rendez-vous." + cta },
{ k: ['ontario', 'province'], a: "Pour l'instant, nous servons les résidents du Québec." },
{ k: ['amf', 'autoris', 'certificat', 'permis'], a: "Les services sont offerts par un conseiller en sécurité financière inscrit auprès de l'Autorité des marchés financiers (certificat 161128), pour le compte de Dubois Services Financiers inc." },
{ k: ['bonjour', 'salut', 'allo', 'hello'], a: "Bonjour ! Comment puis-je vous aider ? Vous pouvez me poser une question sur l'assurance santé, les médicaments ou nos services." }
];
const hit = rules.find((r) => r.k.some((w) => t.includes(w)));
return hit ? hit.a : "Bonne question ! Pour une réponse adaptée à votre situation, un membre de notre équipe peut vous contacter. Appelez le 438 231-4777 ou faites une demande en ligne.";
}
ask(q) {
const text = (q || '').trim();
if (!text) { return; }
this.setState((st) => ({ draft: '', messages: st.messages.concat([{ from: 'me', text }, { from: 'bot', text: this.answer(text) }]) }));
}
chooseProduct(label) {
const members = label === 'Investissement' ? [{ role: 'adult', age: '', smoker: null }] : [];
this.setState({ fProduct: label, step: 2, fWho: null, fGroup: null, fEmp: null, members, err: false });
}
buildMembers(who) {
const A = { role: 'adult', age: '', smoker: null }, S = { role: 'spouse', age: '', smoker: null }, K = { role: 'child', age: '', smoker: null };
const map = { 'Individuel': [A], 'Moi seulement': [A], 'Couple': [A, S], 'Mon conjoint et moi': [A, S], 'Monoparental': [A, K], 'Familial': [A, S, K] };
return (map[who] || [A]).map((m) => Object.assign({}, m));
}
renderVals() {
const products = [
{ id: 'sante', label: 'Santé', name: 'Santé, dentaire et voyage', features: ['Soins médicaux et médicaments', 'Dentaire et paramédical', 'Voyage, selon le plan'], cta: 'Commencer ma demande' },
{ id: 'group', label: 'Collective', name: 'Assurance collective (entreprise)', features: [], cta: '' },
{ id: 'vie', label: 'Vie', name: 'Assurance vie', features: ['Montant de protection', 'Durée de la protection', 'Prime adaptée au budget'], cta: 'Commencer ma demande' },
{ id: 'invalidite', label: 'Invalidité', name: 'Assurance invalidité', features: ['Revenu mensuel protégé', 'Délai avant les prestations', 'Durée des prestations'], cta: 'Commencer ma demande' },
{ id: 'mg', label: 'Maladie grave', name: 'Assurance maladie grave', features: ['Montant forfaitaire', 'Maladies couvertes', 'Options offertes'], cta: 'Commencer ma demande' },
{ id: 'invest', label: 'Investissement', name: 'Investissement', features: ['Vos objectifs d\'épargne et de retraite', 'Votre horizon de placement', 'Votre tolérance au risque'], cta: 'Commencer ma demande' }
];
const formName = { group: 'Assurance collective (entreprise)', sante: 'Santé, dentaire et voyage', vie: 'Assurance vie', invalidite: 'Invalidité', mg: 'Maladie grave', invest: 'Investissement' };
const found = products.find((p) => p.id === this.state.product) || products[0];
const cur = Object.assign({}, found, { start: () => this.chooseProduct(formName[found.id]), btn: found.id === 'group' ? 'Obtenir une soumission' : found.id === 'invest' ? 'Prendre rendez-vous' : 'Obtenir mes 3 offres' });
const sits = [
{ id: 'meds', tag: 'SITUATION 01', label: 'Médicaments non couverts', title: 'Médicament refusé par votre collectif ou la RAMQ ? On a des options.', text: "Votre régime collectif ou la RAMQ ne couvre pas votre médicament ? Chaque compagnie a sa propre liste, et certaines peuvent accepter des médicaments que vous prenez déjà.", points: ['On vérifie votre médicament, compagnie par compagnie', 'Certaines compagnies acceptent les médicaments déjà pris', 'Seulement les offres qui ont du sens pour vous'] },
{ id: 'pre', tag: 'SITUATION 02', label: 'Condition préexistante', title: 'Condition préexistante ? La porte reste ouverte.', text: "Il existe des plans sans questionnaire médical. Et si vous quittez une assurance collective, une fenêtre limitée peut vous permettre d'adhérer sans preuve de santé.", points: ['Plans sans questionnaire médical', 'Sans preuve de santé après un collectif (environ 90 jours)', 'Une discussion franche sur vos options'] },
{ id: 'ok', tag: 'SITUATION 03', label: 'En bonne santé', title: 'En bonne santé ? Payez le juste prix.', text: "Vous avez accès à plus de choix, avec ou sans questionnaire médical. On compare pour trouver le meilleur rapport protection-prix.", points: ['Médical, dentaire et voyage selon le plan', 'Avec ou sans questionnaire médical', 'Les 3 meilleures offres pour votre profil'] }
];

const faqData = {

{ q: 'Que se passe-t-il après ma demande ?', a: "Un membre de notre équipe vous contacte pour discuter de vos besoins. Ensuite, on compare les compagnies et on vous présente vos 3 meilleures offres." },

],
